# alembic.ini — Alembic configuration
#
# The SQLAlchemy URL is NOT set here. It is built dynamically in
# migrations/env.py from your .env file so there is a single source
# of truth for database credentials.
#
# Usage:
#   alembic upgrade head          # apply all pending migrations
#   alembic downgrade -1          # roll back one migration
#   alembic current               # show current revision
#   alembic history --verbose     # show full migration history
#   alembic revision -m "add foo" # generate a new migration file

[alembic]
script_location = migrations

# Prepend sys.path with this directory so db_config.py is importable
prepend_sys_path = .

# File format for new revision files
file_template = %%(rev)s_%%(slug)s

# Truncate long revision message slugs
truncate_slug_length = 40

timezone = UTC

[post_write_hooks]
# Automatically run ruff format on newly generated migration files
# Requires: pip install ruff
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S